          @Composable
          fun ExpandedRemoteSheet(state: CastUiState, actions: CastActions) {
              val np = state.nowPlaying ?: return
              val deviceName = state.connectedDevice?.name.orEmpty()

              Dialog(
                  onDismissRequest = actions::onDismissSheet,
                  properties = DialogProperties(usePlatformDefaultWidth = false, decorFitsSystemWindows = false)
              ) {
                  Surface(modifier = Modifier.fillMaxSize(), color = CastColors.Background) {
                      Column(
                          modifier = Modifier
                              .fillMaxSize()
                              .systemBarsPadding()
                              .verticalScroll(rememberScrollState())
                              .padding(horizontal = 20.dp, vertical = 8.dp),
                          verticalArrangement = Arrangement.spacedBy(18.dp)
                      ) {
                          RemoteHeader(deviceName, state.isConnected, actions)

                          Box(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .aspectRatio(16f / 9f)
                                  .clip(RoundedCornerShape(20.dp))
                                  .background(
                                      Brush.linearGradient(
                                          listOf(np.stream.posterAccent, np.stream.posterAccent.copy(alpha = 0.4f), CastColors.Card)
                                      )
                                  ),
                              contentAlignment = Alignment.Center
                          ) {
                              PosterArt(Color.Transparent, Modifier.fillMaxSize(), iconSize = 64.dp, cornerRadius = 20.dp)
                              QualityBadge(
                                  "${np.stream.quality} ${np.stream.container}",
                                  modifier = Modifier.align(Alignment.BottomStart).padding(12.dp)
                              )
                          }

                          Column(verticalArrangement = Arrangement.spacedBy(4.dp)) {
                              Text(
                                  np.stream.title,
                                  style = MaterialTheme.typography.headlineSmall.copy(fontWeight = FontWeight.Bold),
                                  maxLines = 2,
                                  overflow = TextOverflow.Ellipsis
                              )
                              Text(
                                  "${np.stream.sizeLabel} \u2022 ${np.stream.quality} ${np.stream.container}",
                                  color = CastColors.TextSecondary,
                                  style = MaterialTheme.typography.bodySmall
                              )
                          }

                          Timeline(state, actions)
                          TransportControls(state, actions)

                          Row(verticalAlignment = Alignment.CenterVertically) {
                              Icon(Icons.Filled.VolumeDown, contentDescription = null, tint = CastColors.TextSecondary)
                              Slider(
                                  value = state.volume,
                                  onValueChange = actions::onVolumeChange,
                                  colors = castSliderColors(),
                                  modifier = Modifier.weight(1f).padding(horizontal = 8.dp)
                              )
                              Icon(Icons.Filled.VolumeUp, contentDescription = "TV volume", tint = CastColors.TextSecondary)
                          }

                          UtilityTabs(state, actions)
                      }
                  }
              }
          }

          @Composable
          private fun RemoteHeader(deviceName: String, connected: Boolean, actions: CastActions) {
              Row(verticalAlignment = Alignment.CenterVertically) {
                  IconButton(onClick = actions::onDismissSheet) {
                      Icon(Icons.Filled.KeyboardArrowDown, contentDescription = "Collapse", modifier = Modifier.size(30.dp))
                  }
                  Column(Modifier.weight(1f), horizontalAlignment = Alignment.CenterHorizontally) {
                      SectionLabel("Playing on")
                      Text(
                          deviceName,
                          color = CastColors.Cyan,
                          style = MaterialTheme.typography.titleSmall.copy(fontWeight = FontWeight.SemiBold),
                          maxLines = 1,
                          overflow = TextOverflow.Ellipsis
                      )
                  }
                  IconButton(onClick = actions::onShowDevicePicker) {
                      Icon(
                          imageVector = if (connected) Icons.Filled.CastConnected else Icons.Filled.Cast,
                          contentDescription = "Change device",
                          tint = CastColors.Cyan
                      )
                  }
              }
          }

          @Composable
          private fun Timeline(state: CastUiState, actions: CastActions) {
              val np = state.nowPlaying ?: return
              var drag by remember { mutableStateOf<Float?>(null) }
              val shown = drag ?: np.progress

              Column {
                  Slider(
                      value = shown,
                      onValueChange = { drag = it },
                      onValueChangeFinished = {
                          drag?.let { actions.onSeekToFraction(it) }
                          drag = null
                      },
                      enabled = state.canSeek,
                      colors = castSliderColors()
                  )
                  Row(Modifier.fillMaxWidth().padding(horizontal = 4.dp), horizontalArrangement = Arrangement.SpaceBetween) {
                      Text(
                          formatDuration((shown * np.stream.durationMs).toLong()),
                          color = CastColors.TextSecondary,
                          style = MaterialTheme.typography.labelMedium
                      )
                      Text(
                          formatDuration(np.stream.durationMs),
                          color = CastColors.TextSecondary,
                          style = MaterialTheme.typography.labelMedium
                      )
                  }
                  if (!state.canSeek) {
                      Row(
                          modifier = Modifier.padding(top = 8.dp),
                          verticalAlignment = Alignment.CenterVertically,
                          horizontalArrangement = Arrangement.spacedBy(6.dp)
                      ) {
                          Icon(Icons.Filled.Lock, contentDescription = null, tint = CastColors.TextSecondary, modifier = Modifier.size(14.dp))
                          Text(
                              "Seeking isn't supported by ${state.connectedDevice?.name.orEmpty()} (${state.connectedDevice?.protocol?.tag.orEmpty()})",
                              color = CastColors.TextSecondary,
                              style = MaterialTheme.typography.labelSmall
                          )
                      }
                  }
              }
          }

          @Composable
          private fun TransportControls(state: CastUiState, actions: CastActions) {
              val playing = state.nowPlaying?.isPlaying == true
              Row(
                  modifier = Modifier.fillMaxWidth(),
                  horizontalArrangement = Arrangement.spacedBy(28.dp, Alignment.CenterHorizontally),
                  verticalAlignment = Alignment.CenterVertically
              ) {
                  IconButton(
                      onClick = { actions.onSeekBy(-15_000L) },
                      enabled = state.canSeek,
                      modifier = Modifier.size(56.dp)
                  ) {
                      SeekBackIcon(seconds = 15, size = 36.dp)
                  }
                  FloatingActionButton(
                      onClick = actions::onTogglePlayPause,
                      containerColor = CastColors.Cyan,
                      contentColor = Color.Black,
                      shape = CircleShape,
                      modifier = Modifier.size(72.dp)
                  ) {
                      Icon(
                          imageVector = if (playing) Icons.Filled.Pause else Icons.Filled.PlayArrow,
                          contentDescription = if (playing) "Pause" else "Play",
                          modifier = Modifier.size(38.dp)
                      )
                  }
                  IconButton(
                      onClick = { actions.onSeekBy(30_000L) },
                      enabled = state.canSeek,
                      modifier = Modifier.size(56.dp)
                  ) {
                      Icon(Icons.Filled.Forward30, contentDescription = "Forward 30 seconds", modifier = Modifier.size(36.dp))
                  }
              }
          }

          private fun RemoteTab.icon(): ImageVector = when (this) {
              RemoteTab.SubtitleSync -> Icons.Filled.Subtitles
              RemoteTab.DPad -> Icons.Filled.Gamepad
              RemoteTab.Queue -> Icons.AutoMirrored.Filled.PlaylistPlay
          }

          @Composable
          private fun UtilityTabs(state: CastUiState, actions: CastActions) {
              Column {
                  TabRow(
                      selectedTabIndex = state.remoteTab.ordinal,
                      containerColor = Color.Transparent,
                      contentColor = CastColors.Cyan
                  ) {
                      RemoteTab.entries.forEach { tab ->
                          Tab(
                              selected = tab == state.remoteTab,
                              onClick = { actions.onSelectRemoteTab(tab) },
                              selectedContentColor = CastColors.Cyan,
                              unselectedContentColor = CastColors.TextSecondary,
                              icon = { Icon(tab.icon(), contentDescription = null) },
                              text = {
                                  Text(
                                      if (tab == RemoteTab.Queue) "Queue (${state.queue.size})" else tab.title,
                                      maxLines = 1,
                                      style = MaterialTheme.typography.labelMedium
                                  )
                              }
                          )
                      }
                  }
                  Box(Modifier.fillMaxWidth().padding(top = 16.dp, bottom = 24.dp)) {
                      when (state.remoteTab) {
                          RemoteTab.SubtitleSync -> SubtitleSyncTab(state, actions)
                          RemoteTab.DPad -> DPadTab(state, actions)
                          RemoteTab.Queue -> QueueTab(state, actions)
                      }
                  }
              }
          }

          // ------------------------------------------------------------ Subtitle sync

          private fun Context.displayNameOf(uri: Uri): String =
              contentResolver.query(uri, arrayOf(OpenableColumns.DISPLAY_NAME), null, null, null)?.use { cursor ->
                  if (cursor.moveToFirst()) cursor.getString(0) else null
              } ?: uri.lastPathSegment ?: "subtitles.srt"

          @Composable
          private fun SubtitleSyncTab(state: CastUiState, actions: CastActions) {
              val context = LocalContext.current
              val picker = rememberLauncherForActivityResult(ActivityResultContracts.OpenDocument()) { uri: Uri? ->
                  if (uri != null) actions.onSubtitleSelected(context.displayNameOf(uri))
              }

              Column(verticalArrangement = Arrangement.spacedBy(14.dp)) {
                  Column(
                      modifier = Modifier
                          .fillMaxWidth()
                          .clip(RoundedCornerShape(16.dp))
                          .background(CastColors.CardHigh)
                          .padding(16.dp),
                      horizontalAlignment = Alignment.CenterHorizontally,
                      verticalArrangement = Arrangement.spacedBy(10.dp)
                  ) {
                      SectionLabel("Subtitle delay")
                      Text(
                          formatDelay(state.subtitleDelayMs),
                          color = if (state.subtitleDelayMs == 0) CastColors.TextPrimary else CastColors.Cyan,
                          style = MaterialTheme.typography.headlineMedium.copy(fontWeight = FontWeight.Bold)
                      )
                      Row(horizontalArrangement = Arrangement.spacedBy(12.dp)) {
                          OutlinedButton(
                              onClick = { actions.onSubtitleDelay(-500) },
                              modifier = Modifier.weight(1f).height(48.dp),
                              border = BorderStroke(1.dp, CastColors.Outline)
                          ) { Text("-0.5s") }
                          OutlinedButton(
                              onClick = { actions.onSubtitleDelay(500) },
                              modifier = Modifier.weight(1f).height(48.dp),
                              border = BorderStroke(1.dp, CastColors.Outline)
                          ) { Text("+0.5s") }
                      }
                      TextButton(onClick = actions::onResetSubtitleDelay, enabled = state.subtitleDelayMs != 0) {
                          Text("Reset", color = if (state.subtitleDelayMs != 0) CastColors.Cyan else CastColors.TextSecondary)
