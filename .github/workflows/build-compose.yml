                  clipboard.setText(AnnotatedString(stream.url))
                  actions.onLinkCopied(stream.id)
              }
              val main = state.mainStream
              val others = state.otherStreams

              ModalBottomSheet(
                  onDismissRequest = actions::onDismissSheet,
                  sheetState = rememberModalBottomSheetState(skipPartiallyExpanded = true),
                  containerColor = CastColors.Card,
                  contentColor = CastColors.TextPrimary
              ) {
                  Column(Modifier.fillMaxWidth()) {
                      Column(
                          modifier = Modifier
                              .weight(1f, fill = false)
                              .verticalScroll(rememberScrollState())
                              .padding(horizontal = 16.dp),
                          verticalArrangement = Arrangement.spacedBy(12.dp)
                      ) {
