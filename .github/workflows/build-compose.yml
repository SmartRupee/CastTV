                          }
                          DPadButton(Icons.AutoMirrored.Filled.KeyboardArrowRight, "Right") { actions.onDpad(DpadKey.Right) }
                      }
                      DPadButton(Icons.Filled.KeyboardArrowDown, "Down") { actions.onDpad(DpadKey.Down) }
