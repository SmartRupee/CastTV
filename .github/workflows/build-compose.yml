                              Column(Modifier.weight(1f)) {
                                  Text("Detected media", style = MaterialTheme.typography.titleLarge.copy(fontWeight = FontWeight.Bold))
                                  Text(
                                      "${state.detectedStreams.size} streams found on ${hostOf(state.currentUrl)}",
                                      color = CastColors.TextSecondary,
                                      style = MaterialTheme.typography.bodySmall
                                  )
                              }
                          }

                          if (main != null) {
                              SectionLabel("Recommended Main Video")
                              MainStreamCard(
                                  stream = main,
                                  onCast = { actions.onCastStream(main.id) },
                                  onQueue = { actions.onAddToQueue(main.id) },
                                  onCopy = { copyLink(main) }
                              )
                          }

                          if (others.isNotEmpty()) {
                              SectionLabel("Other Streams / Previews", Modifier.padding(top = 4.dp))
                              others.forEach { stream ->
                                  OtherStreamRow(
                                      stream = stream,
                                      onCast = { actions.onCastStream(stream.id) },
                                      onQueue = { actions.onAddToQueue(stream.id) },
                                      onCopy = { copyLink(stream) }
                                  )
                              }
                          }
                          Spacer(Modifier.height(4.dp))
                      }
                      BannerAdPlaceholder()
                  }
              }
          }

