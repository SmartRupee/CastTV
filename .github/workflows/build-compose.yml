          fun MainBrowserContent(state: CastUiState, actions: CastActions) {
              val snackbarHostState = remember { SnackbarHostState() }

              LaunchedEffect(state.message) {
                  state.message?.let { text ->
                      snackbarHostState.showSnackbar(text)
                      actions.onMessageShown()
                  }
              }

              Scaffold(
                  containerColor = CastColors.Background,
                  contentWindowInsets = WindowInsets(0, 0, 0, 0),
                  topBar = { CastTopBar(state, actions) },
                  bottomBar = {
                      Surface(color = CastColors.Card) {
                          Column(
                              Modifier.windowInsetsPadding(WindowInsets.navigationBars.union(WindowInsets.ime))
                          ) {
                              AnimatedVisibility(
                                  visible = state.isCasting,
                                  enter = expandVertically() + fadeIn(),
                                  exit = shrinkVertically() + fadeOut()
                              ) {
                                  MiniController(state, actions)
                              }
                              BrowserOmnibox(state, actions)
                          }
                      }
                  },
                  snackbarHost = {
                      SnackbarHost(snackbarHostState) { data ->
                          Snackbar(
                              snackbarData = data,
                              containerColor = CastColors.CardHigh,
                              contentColor = CastColors.TextPrimary,
                              actionColor = CastColors.Cyan
                          )
                      }
                  }
              ) { padding ->
                  Box(Modifier.padding(padding).fillMaxSize()) {
                      if (state.hasPage) WebPagePreview(state, actions) else HomeHub(state, actions)
                  }
              }

              when (state.activeSheet) {
                  ActiveSheet.DevicePicker -> DevicePickerBottomSheet(state, actions)
                  ActiveSheet.DetectedMedia -> DetectedMediaBottomSheet(state, actions)
                  ActiveSheet.ExpandedRemote -> ExpandedRemoteSheet(state, actions)
                  ActiveSheet.None -> Unit
              }
          }

          // ------------------------------------------------------------------ Top bar

          @Composable
          private fun CastTopBar(state: CastUiState, actions: CastActions) {
              var menuOpen by remember { mutableStateOf(false) }
              Row(
                  modifier = Modifier
                      .fillMaxWidth()
                      .background(CastColors.Background)
                      .statusBarsPadding()
                      .padding(horizontal = 12.dp, vertical = 8.dp),
                  verticalAlignment = Alignment.CenterVertically
              ) {
                  ConnectionPill(
                      label = state.statusLabel,
                      connected = state.isConnected,
                      onClick = actions::onShowDevicePicker,
                      modifier = Modifier.weight(1f, fill = false)
                  )
                  Spacer(Modifier.weight(1f))
                  AdBlockBadge(count = state.adsBlocked)
                  Box {
                      IconButton(onClick = { menuOpen = true }) {
                          Icon(Icons.Filled.MoreVert, contentDescription = "More options")
                      }
                      DropdownMenu(
                          expanded = menuOpen,
                          onDismissRequest = { menuOpen = false },
                          modifier = Modifier.background(CastColors.CardHigh)
                      ) {
                          DropdownMenuItem(
                              text = { Text("Home") },
                              leadingIcon = { Icon(Icons.Filled.Home, contentDescription = null) },
                              onClick = {
                                  menuOpen = false
                                  actions.onGoHome()
                              }
                          )
                          DropdownMenuItem(
                              text = { Text("Rescan devices") },
                              leadingIcon = { Icon(Icons.Filled.Cast, contentDescription = null) },
                              onClick = {
                                  menuOpen = false
                                  actions.onRescanDevices()
                                  actions.onShowDevicePicker()
                              }
                          )
                          DropdownMenuItem(
                              text = { Text("Reset ad-block counter") },
                              leadingIcon = { Icon(Icons.Filled.RestartAlt, contentDescription = null) },
                              onClick = {
                                  menuOpen = false
                                  actions.onResetAdCounter()
                              }
                          )
                      }
                  }
              }
          }

          @Composable
          private fun ConnectionPill(
              label: String,
              connected: Boolean,
              onClick: () -> Unit,
              modifier: Modifier = Modifier
          ) {
              val accent = if (connected) CastColors.Cyan else CastColors.TextSecondary
              Row(
                  modifier = modifier
                      .clip(RoundedCornerShape(50))
                      .background(if (connected) CastColors.Cyan.copy(alpha = 0.14f) else CastColors.CardHigh)
                      .border(1.dp, if (connected) CastColors.Cyan else CastColors.Outline, RoundedCornerShape(50))
                      .clickable(onClick = onClick)
                      .padding(horizontal = 14.dp, vertical = 8.dp),
                  verticalAlignment = Alignment.CenterVertically
              ) {
                  Icon(
                      imageVector = if (connected) Icons.Filled.CastConnected else Icons.Filled.Cast,
                      contentDescription = null,
                      tint = accent,
                      modifier = Modifier.size(18.dp)
                  )
                  Spacer(Modifier.width(8.dp))
                  Text(
                      text = label,
                      color = if (connected) CastColors.Cyan else CastColors.TextPrimary,
                      style = MaterialTheme.typography.labelLarge.copy(fontWeight = FontWeight.SemiBold),
                      maxLines = 1,
                      overflow = TextOverflow.Ellipsis
                  )
              }
          }

          @Composable
          private fun AdBlockBadge(count: Int) {
              Row(
                  modifier = Modifier
                      .clip(RoundedCornerShape(50))
                      .background(CastColors.CardHigh)
                      .padding(horizontal = 10.dp, vertical = 6.dp),
                  verticalAlignment = Alignment.CenterVertically
              ) {
                  Icon(Icons.Filled.Shield, contentDescription = "Ads blocked", tint = CastColors.Cyan, modifier = Modifier.size(16.dp))
                  Spacer(Modifier.width(6.dp))
                  Text(
                      text = count.toString(),
                      color = CastColors.TextPrimary,
                      style = MaterialTheme.typography.labelLarge.copy(fontWeight = FontWeight.Bold)
                  )
              }
          }

          // ----------------------------------------------------------------- Home hub

          @Composable
          private fun HomeHub(state: CastUiState, actions: CastActions) {
              LazyColumn(
                  modifier = Modifier.fillMaxSize(),
                  contentPadding = PaddingValues(16.dp),
                  verticalArrangement = Arrangement.spacedBy(16.dp)
              ) {
                  item {
                      Row(verticalAlignment = Alignment.CenterVertically) {
                          Box(
                              modifier = Modifier.size(44.dp).clip(CircleShape).background(CastColors.Cyan),
                              contentAlignment = Alignment.Center
                          ) {
                              Icon(Icons.Filled.Cast, contentDescription = null, tint = Color.Black)
                          }
                          Spacer(Modifier.width(12.dp))
                          Column {
                              Text("Nilesh Cast", style = MaterialTheme.typography.titleLarge.copy(fontWeight = FontWeight.Bold))
                              Text("Browse, detect and cast. Free.", color = CastColors.TextSecondary, style = MaterialTheme.typography.bodySmall)
                          }
                      }
                  }
                  item {
                      Column(verticalArrangement = Arrangement.spacedBy(10.dp)) {
                          SectionLabel("Quick Access")
                          Row(horizontalArrangement = Arrangement.spacedBy(10.dp)) {
                              QuickAccess.entries.forEach { item ->
                                  QuickAccessCard(
                                      item = item,
                                      onClick = { actions.onQuickAccess(item) },
                                      modifier = Modifier.weight(1f)
                                  )
                              }
                          }
                      }
                  }
                  item {
                      Column(verticalArrangement = Arrangement.spacedBy(10.dp)) {
                          SectionLabel("Recently Visited")
                          Card(
                              shape = RoundedCornerShape(16.dp),
                              colors = CardDefaults.cardColors(containerColor = CastColors.Card)
                          ) {
                              Column {
                                  state.recents.forEach { site ->
                                      RecentRow(site) { actions.onOpenUrl(site.url) }
                                  }
                              }
                          }
                      }
                  }
                  item { NativeAdCard() }
              }
          }

          private fun QuickAccess.icon(): ImageVector = when (this) {
              QuickAccess.LocalMedia -> Icons.Filled.VideoLibrary
              QuickAccess.IptvM3u -> Icons.Filled.LiveTv
              QuickAccess.Bookmarks -> Icons.Filled.Bookmarks
          }

          @Composable
          private fun QuickAccessCard(item: QuickAccess, onClick: () -> Unit, modifier: Modifier = Modifier) {
              Card(
                  onClick = onClick,
                  modifier = modifier,
                  shape = RoundedCornerShape(16.dp),
                  colors = CardDefaults.cardColors(containerColor = CastColors.Card)
              ) {
                  Column(
                      modifier = Modifier.fillMaxWidth().padding(vertical = 16.dp, horizontal = 8.dp),
                      horizontalAlignment = Alignment.CenterHorizontally,
                      verticalArrangement = Arrangement.spacedBy(8.dp)
                  ) {
                      Box(
                          modifier = Modifier.size(44.dp).clip(CircleShape).background(CastColors.Cyan.copy(alpha = 0.14f)),
                          contentAlignment = Alignment.Center
                      ) {
                          Icon(item.icon(), contentDescription = null, tint = CastColors.Cyan)
                      }
                      Text(item.title, style = MaterialTheme.typography.labelLarge.copy(fontWeight = FontWeight.SemiBold), maxLines = 1)
                      Text(item.subtitle, color = CastColors.TextSecondary, style = MaterialTheme.typography.labelSmall, maxLines = 1)
                  }
              }
          }

          @Composable
          private fun RecentRow(site: RecentSite, onClick: () -> Unit) {
              Row(
                  modifier = Modifier.fillMaxWidth().clickable(onClick = onClick).padding(horizontal = 14.dp, vertical = 12.dp),
                  verticalAlignment = Alignment.CenterVertically
              ) {
                  Box(
                      modifier = Modifier.size(38.dp).clip(CircleShape).background(CastColors.CardHigh),
                      contentAlignment = Alignment.Center
                  ) {
                      Text(
                          text = site.title.first().uppercase(),
                          color = CastColors.Cyan,
                          style = MaterialTheme.typography.titleSmall.copy(fontWeight = FontWeight.Bold)
                      )
                  }
                  Spacer(Modifier.width(12.dp))
                  Column(Modifier.weight(1f)) {
                      Text(site.title, style = MaterialTheme.typography.bodyMedium.copy(fontWeight = FontWeight.Medium), maxLines = 1, overflow = TextOverflow.Ellipsis)
                      Text(hostOf(site.url), color = CastColors.TextSecondary, style = MaterialTheme.typography.bodySmall, maxLines = 1)
                  }
              }
          }

          @Composable
          private fun NativeAdCard() {
              Card(
                  shape = RoundedCornerShape(16.dp),
                  colors = CardDefaults.cardColors(containerColor = CastColors.Card),
                  modifier = Modifier.border(1.dp, CastColors.AdAmber.copy(alpha = 0.35f), RoundedCornerShape(16.dp))
              ) {
                  Column(Modifier.padding(14.dp), verticalArrangement = Arrangement.spacedBy(10.dp)) {
                      Row(verticalAlignment = Alignment.CenterVertically) {
                          QualityBadge("AD", color = CastColors.AdAmber)
                          Spacer(Modifier.width(8.dp))
                          Text("Sponsored", color = CastColors.TextSecondary, style = MaterialTheme.typography.labelMedium)
                      }
                      Row(verticalAlignment = Alignment.CenterVertically) {
                          Box(
                              modifier = Modifier.size(56.dp).clip(RoundedCornerShape(12.dp)).background(CastColors.CardHigh),
                              contentAlignment = Alignment.Center
                          ) {
                              Icon(Icons.Filled.Campaign, contentDescription = null, tint = CastColors.AdAmber)
                          }
                          Spacer(Modifier.width(12.dp))
                          Column(Modifier.weight(1f)) {
                              Text("Native ad placeholder", style = MaterialTheme.typography.titleSmall.copy(fontWeight = FontWeight.SemiBold))
                              Text(
                                  "A single sponsored card appears here. Ads never play over your casting.",
                                  color = CastColors.TextSecondary,
                                  style = MaterialTheme.typography.bodySmall
                              )
                          }
                      }
                      TextButton(onClick = {}, modifier = Modifier.align(Alignment.End)) {
                          Text("Learn more", color = CastColors.Cyan)
                      }
                  }
              }
          }

          // ------------------------------------------------------- Page (mock browser)

          @Composable
          private fun WebPagePreview(state: CastUiState, actions: CastActions) {
              Column(Modifier.fillMaxSize()) {
                  if (state.isLoading) {
                      LinearProgressIndicator(
                          modifier = Modifier.fillMaxWidth().height(2.dp),
                          color = CastColors.Cyan,
                          trackColor = Color.Transparent
                      )
                  } else {
                      Spacer(Modifier.height(2.dp))
                  }
                  Column(
                      modifier = Modifier.weight(1f).verticalScroll(rememberScrollState()).padding(16.dp),
                      verticalArrangement = Arrangement.spacedBy(14.dp)
                  ) {
                      Text(hostOf(state.currentUrl), style = MaterialTheme.typography.headlineSmall.copy(fontWeight = FontWeight.Bold))
                      Text(state.currentUrl, color = CastColors.TextSecondary, style = MaterialTheme.typography.bodySmall, maxLines = 1, overflow = TextOverflow.Ellipsis)
                      Box(
                          modifier = Modifier
                              .fillMaxWidth()
                              .aspectRatio(16f / 9f)
                              .clip(RoundedCornerShape(16.dp))
                              .background(Brush.linearGradient(listOf(Color(0xFF1565C0), CastColors.CardHigh)))
                              .clickable(onClick = actions::onShowDetectedMedia),
                          contentAlignment = Alignment.Center
                      ) {
                          Box(
                              modifier = Modifier.size(64.dp).clip(CircleShape).background(Color.Black.copy(alpha = 0.45f)),
                              contentAlignment = Alignment.Center
                          ) {
                              Icon(Icons.Filled.PlayArrow, contentDescription = "Play video", tint = Color.White, modifier = Modifier.size(40.dp))
                          }
                      }
                      listOf(1f, 0.92f, 0.97f, 0.6f).forEach { fraction ->
                          Box(
                              Modifier
                                  .fillMaxWidth(fraction)
                                  .height(12.dp)
                                  .clip(RoundedCornerShape(6.dp))
                                  .background(CastColors.CardHigh)
                          )
                      }
                  }
              }
          }

          // ------------------------------------------------------------ Bottom: omnibox

          @Composable
          private fun BrowserOmnibox(state: CastUiState, actions: CastActions) {
              Row(
                  modifier = Modifier.fillMaxWidth().padding(horizontal = 8.dp, vertical = 8.dp),
                  verticalAlignment = Alignment.CenterVertically,
                  horizontalArrangement = Arrangement.spacedBy(4.dp)
              ) {
                  IconButton(onClick = actions::onBack, enabled = state.canGoBack, modifier = Modifier.size(38.dp)) {
                      Icon(Icons.AutoMirrored.Filled.ArrowBack, contentDescription = "Back")
                  }
                  IconButton(onClick = actions::onForward, enabled = state.canGoForward, modifier = Modifier.size(38.dp)) {
                      Icon(Icons.AutoMirrored.Filled.ArrowForward, contentDescription = "Forward")
                  }
                  OmniboxField(
                      value = state.urlInput,
                      onValueChange = actions::onUrlInputChange,
                      onGo = actions::onSubmitUrl,
                      modifier = Modifier.weight(1f)
                  )
                  if (state.hasPage && state.detectedStreams.isNotEmpty()) {
                      DetectedMediaPill(count = state.detectedStreams.size, onClick = actions::onShowDetectedMedia)
                  }
                  IconButton(onClick = actions::onShowDevicePicker, modifier = Modifier.size(38.dp)) {
                      Icon(
                          imageVector = if (state.isConnected) Icons.Filled.CastConnected else Icons.Filled.Cast,
                          contentDescription = "Cast",
                          tint = if (state.isConnected) CastColors.Cyan else CastColors.TextPrimary
                      )
                  }
              }
          }

          @Composable
          private fun OmniboxField(
              value: String,
              onValueChange: (String) -> Unit,
              onGo: () -> Unit,
              modifier: Modifier = Modifier
          ) {
              BasicTextField(
                  value = value,
                  onValueChange = onValueChange,
                  singleLine = true,
                  textStyle = MaterialTheme.typography.bodyMedium.copy(color = CastColors.TextPrimary),
                  cursorBrush = SolidColor(CastColors.Cyan),
                  keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Uri, imeAction = ImeAction.Go),
                  keyboardActions = KeyboardActions(onGo = { onGo() }),
                  modifier = modifier,
                  decorationBox = { inner ->
                      Row(
                          modifier = Modifier
                              .height(40.dp)
                              .clip(RoundedCornerShape(20.dp))
                              .background(CastColors.CardHigh)
                              .padding(horizontal = 12.dp),
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          Icon(Icons.Filled.Search, contentDescription = null, tint = CastColors.TextSecondary, modifier = Modifier.size(18.dp))
                          Spacer(Modifier.width(8.dp))
                          Box(Modifier.weight(1f), contentAlignment = Alignment.CenterStart) {
                              if (value.isEmpty()) {
                                  Text(
                                      "Search or enter URL",
                                      color = CastColors.TextSecondary,
                                      style = MaterialTheme.typography.bodyMedium,
                                      maxLines = 1
                                  )
                              }
                              inner()
                          }
                      }
                  }
              )
          }

          @Composable
          private fun DetectedMediaPill(count: Int, onClick: () -> Unit) {
              val transition = rememberInfiniteTransition(label = "detected-pulse")
              val pulse by transition.animateFloat(
                  initialValue = 0.35f,
                  targetValue = 1f,
                  animationSpec = infiniteRepeatable(tween(900, easing = FastOutSlowInEasing), RepeatMode.Reverse),
                  label = "detected-pulse-alpha"
              )
              Row(
                  modifier = Modifier
                      .height(36.dp)
                      .clip(RoundedCornerShape(18.dp))
                      .background(CastColors.Cyan.copy(alpha = 0.16f))
                      .border(1.dp, CastColors.Cyan.copy(alpha = pulse), RoundedCornerShape(18.dp))
                      .clickable(onClick = onClick)
                      .padding(horizontal = 10.dp),
                  verticalAlignment = Alignment.CenterVertically
              ) {
                  Box(
                      Modifier
                          .size(8.dp)
                          .graphicsLayer {
                              scaleX = 0.8f + 0.5f * pulse
                              scaleY = 0.8f + 0.5f * pulse
                          }
                          .background(CastColors.Cyan, CircleShape)
                  )
                  Spacer(Modifier.width(6.dp))
                  Icon(Icons.Filled.SmartDisplay, contentDescription = "Detected media", tint = CastColors.Cyan, modifier = Modifier.size(18.dp))
                  Spacer(Modifier.width(4.dp))
                  Text(
                      text = count.toString(),
                      color = CastColors.Cyan,
                      style = MaterialTheme.typography.labelLarge.copy(fontWeight = FontWeight.Bold)
                  )
              }
          }

          // ----------------------------------------------------------- Mini controller

          @Composable
          private fun MiniController(state: CastUiState, actions: CastActions) {
              val np = state.nowPlaying ?: return
              Column(Modifier.fillMaxWidth().background(CastColors.CardHigh)) {
                  LinearProgressIndicator(
                      progress = { np.progress },
                      modifier = Modifier.fillMaxWidth().height(2.dp),
                      color = CastColors.Cyan,
                      trackColor = CastColors.Outline
                  )
                  Row(
                      modifier = Modifier
                          .fillMaxWidth()
                          .clickable(onClick = actions::onShowRemote)
                          .padding(horizontal = 12.dp, vertical = 8.dp),
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      PosterArt(np.stream.posterAccent, Modifier.size(44.dp), iconSize = 22.dp)
                      Column(Modifier.weight(1f).padding(horizontal = 12.dp)) {
                          Text(
                              np.stream.title,
                              style = MaterialTheme.typography.labelLarge.copy(fontWeight = FontWeight.SemiBold),
                              maxLines = 1,
                              overflow = TextOverflow.Ellipsis
                          )
                          Text(
                              "Casting to ${state.connectedDevice?.name.orEmpty()}",
                              color = CastColors.Cyan,
                              style = MaterialTheme.typography.labelSmall,
                              maxLines = 1,
                              overflow = TextOverflow.Ellipsis
                          )
                      }
                      IconButton(onClick = { actions.onSeekBy(-15_000L) }, enabled = state.canSeek) {
                          SeekBackIcon(seconds = 15, size = 26.dp)
                      }
                      FilledIconButton(
                          onClick = actions::onTogglePlayPause,
                          colors = IconButtonDefaults.filledIconButtonColors(
                              containerColor = CastColors.Cyan,
                              contentColor = Color.Black
                          )
                      ) {
                          Icon(
                              imageVector = if (np.isPlaying) Icons.Filled.Pause else Icons.Filled.PlayArrow,
                              contentDescription = if (np.isPlaying) "Pause" else "Play"
                          )
                      }
                  }
              }
          }
          KTEOF

          mkdir -p "$(dirname 'app/src/main/java/com/nilesh/cast/ui/theme/Theme.kt')"
          cat > 'app/src/main/java/com/nilesh/cast/ui/theme/Theme.kt' <<'KTEOF'
          package com.nilesh.cast.ui.theme

          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.Typography
          import androidx.compose.material3.darkColorScheme
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.graphics.Color

          object CastColors {
              val Background = Color(0xFF121212)
              val Card = Color(0xFF1E1E24)
              val CardHigh = Color(0xFF2A2A33)
              val Cyan = Color(0xFF00E5FF)
              val TextPrimary = Color(0xFFEDEDF2)
              val TextSecondary = Color(0xFF9A9AA6)
              val Outline = Color(0xFF3A3A44)
              val Danger = Color(0xFFFF5C6C)
              val AdAmber = Color(0xFFFFB74D)
          }

          private val CastDarkColorScheme = darkColorScheme(
              primary = CastColors.Cyan,
              onPrimary = Color(0xFF00252B),
              primaryContainer = Color(0xFF004F5A),
              onPrimaryContainer = CastColors.Cyan,
              secondary = CastColors.Cyan,
              onSecondary = Color(0xFF00252B),
              secondaryContainer = CastColors.CardHigh,
              onSecondaryContainer = CastColors.TextPrimary,
              tertiary = CastColors.AdAmber,
              background = CastColors.Background,
              onBackground = CastColors.TextPrimary,
              surface = CastColors.Background,
              onSurface = CastColors.TextPrimary,
              surfaceVariant = CastColors.Card,
              onSurfaceVariant = CastColors.TextSecondary,
              surfaceTint = Color.Transparent,
              surfaceContainerLowest = CastColors.Background,
              surfaceContainerLow = CastColors.Card,
              surfaceContainer = CastColors.Card,
              surfaceContainerHigh = CastColors.CardHigh,
              surfaceContainerHighest = CastColors.CardHigh,
              outline = CastColors.TextSecondary,
              outlineVariant = CastColors.Outline,
              error = CastColors.Danger,
              onError = Color.Black
          )

          @Composable
          fun CastTheme(content: @Composable () -> Unit) {
              MaterialTheme(
                  colorScheme = CastDarkColorScheme,
                  typography = Typography(),
                  content = content
              )
          }
          KTEOF

          mkdir -p "$(dirname 'build.gradle.kts')"
          cat > 'build.gradle.kts' <<'KTEOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "2.0.20" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.20" apply false
          }
          KTEOF

          mkdir -p "$(dirname 'gradle.properties')"
          cat > 'gradle.properties' <<'KTEOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          KTEOF

          mkdir -p "$(dirname 'settings.gradle.kts')"
          cat > 'settings.gradle.kts' <<'KTEOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "NileshCastUI"
          include(":app")
          KTEOF

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Nilesh-Cast-UI.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Nilesh-Cast-UI-APK
          path: Nilesh-Cast-UI.apk

      - name: Publish release (easy download on phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ui-build-${{ github.run_number }}
          name: Nilesh Cast UI build ${{ github.run_number }}
          files: Nilesh-Cast-UI.apk
