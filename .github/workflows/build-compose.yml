name: Build Nilesh Cast UI APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Write project files
        run: |
          mkdir -p "$(dirname 'app/build.gradle.kts')"
          cat > 'app/build.gradle.kts' <<'KTEOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.nilesh.cast"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.nilesh.cast.ui"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              buildFeatures {
                  compose = true
              }
          }

          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.09.03"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.activity:activity-compose:1.9.2")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.8.6")
              implementation("androidx.lifecycle:lifecycle-runtime-compose:2.8.6")
              implementation("androidx.core:core-ktx:1.13.1")
          }
          KTEOF

          mkdir -p "$(dirname 'app/src/main/AndroidManifest.xml')"
          cat > 'app/src/main/AndroidManifest.xml' <<'KTEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>

              <application
                  android:label="Nilesh Cast"
                  android:allowBackup="false"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          KTEOF

          mkdir -p "$(dirname 'app/src/main/java/com/nilesh/cast/MainActivity.kt')"
          cat > 'app/src/main/java/com/nilesh/cast/MainActivity.kt' <<'KTEOF'
          package com.nilesh.cast

          import android.graphics.Color
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.SystemBarStyle
          import androidx.activity.compose.setContent
          import androidx.activity.enableEdgeToEdge
          import com.nilesh.cast.ui.MainBrowserScreen
          import com.nilesh.cast.ui.theme.CastTheme

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  enableEdgeToEdge(
                      statusBarStyle = SystemBarStyle.dark(Color.TRANSPARENT),
                      navigationBarStyle = SystemBarStyle.dark(Color.TRANSPARENT)
                  )
                  setContent {
                      CastTheme {
                          MainBrowserScreen()
                      }
                  }
              }
          }
          KTEOF

          mkdir -p "$(dirname 'app/src/main/java/com/nilesh/cast/ui/CastComponents.kt')"
          cat > 'app/src/main/java/com/nilesh/cast/ui/CastComponents.kt' <<'KTEOF'
          package com.nilesh.cast.ui

          import androidx.compose.foundation.background
          import androidx.compose.foundation.border
          import androidx.compose.foundation.layout.Arrangement
          import androidx.compose.foundation.layout.Box
          import androidx.compose.foundation.layout.Row
          import androidx.compose.foundation.layout.fillMaxSize
          import androidx.compose.foundation.layout.fillMaxWidth
          import androidx.compose.foundation.layout.padding
          import androidx.compose.foundation.layout.size
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.Cast
          import androidx.compose.material.icons.filled.Info
          import androidx.compose.material.icons.filled.LiveTv
          import androidx.compose.material.icons.filled.Movie
          import androidx.compose.material.icons.filled.Replay
          import androidx.compose.material.icons.filled.Router
          import androidx.compose.material.icons.filled.SmartDisplay
          import androidx.compose.material.icons.filled.Tv
          import androidx.compose.material3.Icon
          import androidx.compose.material3.LocalContentColor
          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.SliderColors
          import androidx.compose.material3.SliderDefaults
          import androidx.compose.material3.Text
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Brush
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.vector.ImageVector
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.Dp
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import com.nilesh.cast.ui.theme.CastColors

          fun hostOf(url: String): String =
              url.removePrefix("https://").removePrefix("http://").substringBefore('/').removePrefix("www.")

          fun CastProtocol.icon(): ImageVector = when (this) {
              CastProtocol.Chromecast -> Icons.Filled.Cast
              CastProtocol.Roku -> Icons.Filled.SmartDisplay
              CastProtocol.WebOS -> Icons.Filled.Tv
              CastProtocol.Tizen -> Icons.Filled.LiveTv
              CastProtocol.Dlna -> Icons.Filled.Router
          }

          @Composable
          fun PosterArt(
              accent: Color,
              modifier: Modifier = Modifier,
              iconSize: Dp = 24.dp,
              cornerRadius: Dp = 10.dp
          ) {
              Box(
                  modifier = modifier
                      .clip(RoundedCornerShape(cornerRadius))
                      .background(Brush.linearGradient(listOf(accent, accent.copy(alpha = 0.45f), CastColors.Card))),
                  contentAlignment = Alignment.Center
              ) {
                  Icon(
                      imageVector = Icons.Filled.Movie,
                      contentDescription = null,
                      tint = Color.White.copy(alpha = 0.85f),
                      modifier = Modifier.size(iconSize)
                  )
              }
          }

          @Composable
          fun QualityBadge(text: String, modifier: Modifier = Modifier, color: Color = CastColors.Cyan) {
              Text(
                  text = text,
                  color = color,
                  style = MaterialTheme.typography.labelSmall.copy(fontWeight = FontWeight.Bold),
                  modifier = modifier
                      .clip(RoundedCornerShape(6.dp))
                      .background(color.copy(alpha = 0.16f))
                      .padding(horizontal = 8.dp, vertical = 3.dp)
              )
          }

          @Composable
          fun SectionLabel(text: String, modifier: Modifier = Modifier) {
              Text(
                  text = text.uppercase(),
                  color = CastColors.TextSecondary,
                  style = MaterialTheme.typography.labelMedium.copy(fontWeight = FontWeight.SemiBold, letterSpacing = 0.8.sp),
                  modifier = modifier
              )
          }

          @Composable
          fun SeekBackIcon(seconds: Int, modifier: Modifier = Modifier, size: Dp = 24.dp, tint: Color = LocalContentColor.current) {
              Box(modifier = modifier.size(size), contentAlignment = Alignment.Center) {
                  Icon(Icons.Filled.Replay, contentDescription = null, tint = tint, modifier = Modifier.fillMaxSize())
                  Text(
                      text = seconds.toString(),
                      color = tint,
                      fontSize = (size.value * 0.32f).sp,
                      fontWeight = FontWeight.Bold,
                      modifier = Modifier.padding(top = (size.value * 0.06f).dp)
                  )
              }
          }

          @Composable
          fun castSliderColors(): SliderColors = SliderDefaults.colors(
              thumbColor = CastColors.Cyan,
              activeTrackColor = CastColors.Cyan,
              inactiveTrackColor = CastColors.Outline,
              disabledThumbColor = CastColors.Outline,
              disabledActiveTrackColor = CastColors.Outline,
              disabledInactiveTrackColor = CastColors.CardHigh
          )

          @Composable
          fun InfoBanner(text: String, modifier: Modifier = Modifier) {
              Row(
                  modifier = modifier
                      .fillMaxWidth()
                      .clip(RoundedCornerShape(12.dp))
                      .background(CastColors.CardHigh)
                      .border(1.dp, CastColors.Outline, RoundedCornerShape(12.dp))
                      .padding(12.dp),
                  verticalAlignment = Alignment.CenterVertically,
                  horizontalArrangement = Arrangement.spacedBy(10.dp)
              ) {
                  Icon(Icons.Filled.Info, contentDescription = null, tint = CastColors.TextSecondary, modifier = Modifier.size(18.dp))
                  Text(text, color = CastColors.TextSecondary, style = MaterialTheme.typography.bodySmall)
              }
          }
          KTEOF

          mkdir -p "$(dirname 'app/src/main/java/com/nilesh/cast/ui/CastUiState.kt')"
          cat > 'app/src/main/java/com/nilesh/cast/ui/CastUiState.kt' <<'KTEOF'
          package com.nilesh.cast.ui

          import androidx.compose.runtime.Immutable
          import androidx.compose.ui.graphics.Color
          import java.util.Locale

          enum class DeviceGroup(val title: String) {
              Streaming("Streaming Devices"),
              SmartTv("Smart TVs & DLNA")
          }

          enum class CastProtocol(
              val tag: String,
              val group: DeviceGroup,
              val hint: String,
              val supportsRemoteInput: Boolean
          ) {
              Chromecast("Google Cast", DeviceGroup.Streaming, "Instant cast, no pairing needed", true),
              Roku("Roku ECP", DeviceGroup.Streaming, "Transcoding on phone", true),
              WebOS("LG WebOS", DeviceGroup.SmartTv, "Requires TV PIN approval", true),
              Tizen("Samsung Tizen", DeviceGroup.SmartTv, "Accept the connection prompt on the TV", true),
              Dlna("DLNA / UPnP", DeviceGroup.SmartTv, "Basic playback only, seeking depends on the TV", false)
          }

          @Immutable
          data class CastDevice(
              val id: String,
              val name: String,
              val model: String,
              val ipAddress: String,
              val protocol: CastProtocol,
              val supportsSeek: Boolean
          )

          enum class StreamKind { Main, Preview, Ad }

          @Immutable
          data class DetectedStream(
              val id: String,
              val title: String,
              val url: String,
              val quality: String,
              val container: String,
              val sizeLabel: String,
              val durationMs: Long,
              val kind: StreamKind,
              val posterAccent: Color
          ) {
              val isRecommended: Boolean get() = kind == StreamKind.Main
              val isAd: Boolean get() = kind == StreamKind.Ad
          }

          @Immutable
          data class NowPlaying(
              val stream: DetectedStream,
              val positionMs: Long = 0L,
              val isPlaying: Boolean = true
          ) {
              val progress: Float
                  get() = if (stream.durationMs > 0) {
                      (positionMs.toFloat() / stream.durationMs).coerceIn(0f, 1f)
                  } else 0f
          }

          @Immutable
          data class QueueItem(val queueId: String, val stream: DetectedStream)

          @Immutable
          data class RecentSite(val title: String, val url: String)

          enum class QuickAccess(val title: String, val subtitle: String) {
              LocalMedia("Local Media", "Photos & videos"),
              IptvM3u("IPTV M3U", "Playlists"),
              Bookmarks("Bookmarks", "Saved sites")
          }

          enum class ActiveSheet { None, DevicePicker, DetectedMedia, ExpandedRemote }

          enum class RemoteTab(val title: String) {
              SubtitleSync("Subtitle Sync"),
              DPad("D-Pad"),
              Queue("Queue")
          }

          enum class DpadKey(val label: String) {
              Up("Up"), Down("Down"), Left("Left"), Right("Right"), Ok("OK"), Back("Back"), Home("Home")
          }

          @Immutable
          data class CastUiState(
              val currentUrl: String = "",
              val urlInput: String = "",
              val isLoading: Boolean = false,
              val canGoBack: Boolean = false,
              val canGoForward: Boolean = false,
              val adsBlocked: Int = 0,
              val devices: List<CastDevice> = emptyList(),
              val isScanning: Boolean = false,
              val connectedDevice: CastDevice? = null,
              val detectedStreams: List<DetectedStream> = emptyList(),
              val nowPlaying: NowPlaying? = null,
              val queue: List<QueueItem> = emptyList(),
              val recents: List<RecentSite> = emptyList(),
              val volume: Float = 0.45f,
              val routeAudioToPhone: Boolean = false,
              val subtitleDelayMs: Int = 0,
              val subtitleFileName: String? = null,
              val remoteTab: RemoteTab = RemoteTab.SubtitleSync,
              val lastDpadKey: DpadKey? = null,
              val activeSheet: ActiveSheet = ActiveSheet.None,
              val message: String? = null
          ) {
              val hasPage: Boolean get() = currentUrl.isNotEmpty()
              val isConnected: Boolean get() = connectedDevice != null
              val isCasting: Boolean get() = connectedDevice != null && nowPlaying != null
              val canSeek: Boolean get() = connectedDevice?.supportsSeek == true && nowPlaying != null
              val mainStream: DetectedStream? get() = detectedStreams.firstOrNull { it.isRecommended }
              val otherStreams: List<DetectedStream> get() = detectedStreams.filterNot { it.isRecommended }
              val statusLabel: String get() = connectedDevice?.let { "${it.name} \u2022 CAST" } ?: "Tap to Cast"
          }

          interface CastActions {
              // Browser
              fun onUrlInputChange(value: String)
              fun onSubmitUrl()
              fun onOpenUrl(url: String)
              fun onGoHome()
              fun onBack()
              fun onForward()
              fun onQuickAccess(item: QuickAccess)
              fun onResetAdCounter()

              // Sheets
              fun onShowDevicePicker()
              fun onShowDetectedMedia()
              fun onShowRemote()
              fun onDismissSheet()

              // Devices
              fun onRescanDevices()
              fun onConnectDevice(id: String)
              fun onDisconnect()
              fun onVolumeChange(value: Float)
              fun onRouteAudioToPhone(enabled: Boolean)

              // Streams and playback
              fun onCastStream(id: String)
              fun onAddToQueue(id: String)
              fun onLinkCopied(id: String)
              fun onTogglePlayPause()
              fun onSeekBy(deltaMs: Long)
              fun onSeekToFraction(fraction: Float)

              // Remote utilities
              fun onSelectRemoteTab(tab: RemoteTab)
              fun onSubtitleDelay(deltaMs: Int)
              fun onResetSubtitleDelay()
              fun onSubtitleSelected(fileName: String)
              fun onDpad(key: DpadKey)
              fun onPlayQueueItem(queueId: String)
              fun onRemoveQueueItem(queueId: String)

              fun onMessageShown()
          }

          fun formatDuration(ms: Long): String {
              val total = (ms / 1000).coerceAtLeast(0)
              val h = total / 3600
              val m = (total % 3600) / 60
              val s = total % 60
              return if (h > 0) String.format(Locale.US, "%d:%02d:%02d", h, m, s)
              else String.format(Locale.US, "%d:%02d", m, s)
          }

          fun formatDelay(ms: Int): String = String.format(Locale.US, "%+.1fs", ms / 1000f)
          KTEOF

          mkdir -p "$(dirname 'app/src/main/java/com/nilesh/cast/ui/CastViewModel.kt')"
          cat > 'app/src/main/java/com/nilesh/cast/ui/CastViewModel.kt' <<'KTEOF'
          package com.nilesh.cast.ui

          import androidx.compose.ui.graphics.Color
          import androidx.lifecycle.ViewModel
          import androidx.lifecycle.viewModelScope
          import kotlinx.coroutines.Job
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.flow.StateFlow
          import kotlinx.coroutines.flow.asStateFlow
          import kotlinx.coroutines.flow.update
          import kotlinx.coroutines.isActive
          import kotlinx.coroutines.launch
          import java.net.URLEncoder
          import java.util.UUID
          import kotlin.random.Random

          class CastViewModel : ViewModel(), CastActions {

              private val _uiState = MutableStateFlow(
                  CastUiState(
                      adsBlocked = 128,
                      devices = MockCastData.devices,
                      detectedStreams = MockCastData.streams,
                      queue = MockCastData.queue,
                      recents = MockCastData.recents
                  )
              )
              val uiState: StateFlow<CastUiState> = _uiState.asStateFlow()

              private val history = mutableListOf<String>()
              private var historyIndex = -1
              private var loadJob: Job? = null
              private var scanJob: Job? = null
              private var pendingCastStreamId: String? = null

              init {
                  viewModelScope.launch {
                      while (isActive) {
                          delay(TICK_MS)
                          advancePlayback()
                      }
                  }
              }

              // ---------------------------------------------------------------- Browser

              override fun onUrlInputChange(value: String) {
                  _uiState.update { it.copy(urlInput = value) }
              }

              override fun onSubmitUrl() {
                  onOpenUrl(_uiState.value.urlInput)
              }

              override fun onOpenUrl(url: String) {
                  val target = normalize(url)
                  if (target.isEmpty()) return
                  while (history.size > historyIndex + 1) history.removeAt(history.lastIndex)
                  history.add(target)
                  historyIndex = history.lastIndex
                  showPage(target)
              }

              override fun onGoHome() {
                  history.clear()
                  historyIndex = -1
                  showPage("")
              }

              override fun onBack() {
                  if (historyIndex < 0) return
                  historyIndex--
                  showPage(if (historyIndex < 0) "" else history[historyIndex])
              }

              override fun onForward() {
                  if (historyIndex >= history.lastIndex) return
                  historyIndex++
                  showPage(history[historyIndex])
              }

              override fun onQuickAccess(item: QuickAccess) {
                  val text = when (item) {
                      QuickAccess.LocalMedia -> "Local Media: pick a video from this phone to cast"
                      QuickAccess.IptvM3u -> "IPTV: import an M3U playlist to browse channels"
                      QuickAccess.Bookmarks -> "Bookmarks: you have no saved sites yet"
                  }
                  _uiState.update { it.copy(message = text) }
              }

              override fun onResetAdCounter() {
                  _uiState.update { it.copy(adsBlocked = 0) }
              }

              private fun showPage(url: String) {
                  loadJob?.cancel()
                  _uiState.update {
                      it.copy(
                          currentUrl = url,
                          urlInput = url,
                          isLoading = url.isNotEmpty(),
                          canGoBack = historyIndex >= 0,
                          canGoForward = historyIndex < history.lastIndex
                      )
                  }
                  if (url.isEmpty()) return
                  loadJob = viewModelScope.launch {
                      delay(650)
                      _uiState.update {
                          it.copy(isLoading = false, adsBlocked = it.adsBlocked + Random.nextInt(3, 14))
                      }
                  }
              }

              private fun normalize(input: String): String {
                  val t = input.trim()
                  return when {
                      t.isEmpty() -> ""
                      t.startsWith("http://") || t.startsWith("https://") -> t
                      !t.contains(' ') && t.contains('.') -> "https://$t"
                      else -> "https://duckduckgo.com/?q=" + URLEncoder.encode(t, "UTF-8")
                  }
              }

              // ----------------------------------------------------------------- Sheets

              override fun onShowDevicePicker() {
                  _uiState.update { it.copy(activeSheet = ActiveSheet.DevicePicker) }
              }

              override fun onShowDetectedMedia() {
                  _uiState.update {
                      if (it.detectedStreams.isEmpty()) it else it.copy(activeSheet = ActiveSheet.DetectedMedia)
                  }
              }

              override fun onShowRemote() {
                  _uiState.update {
                      if (it.nowPlaying == null) it else it.copy(activeSheet = ActiveSheet.ExpandedRemote)
                  }
              }

              override fun onDismissSheet() {
                  pendingCastStreamId = null
                  _uiState.update { it.copy(activeSheet = ActiveSheet.None) }
              }

              // ---------------------------------------------------------------- Devices

              override fun onRescanDevices() {
                  scanJob?.cancel()
                  scanJob = viewModelScope.launch {
                      _uiState.update { it.copy(isScanning = true) }
                      delay(1800)
                      _uiState.update { it.copy(isScanning = false, devices = MockCastData.devices) }
                  }
              }

              override fun onConnectDevice(id: String) {
                  val device = _uiState.value.devices.firstOrNull { it.id == id } ?: return
                  val pending = pendingCastStreamId
                  pendingCastStreamId = null
                  _uiState.update {
                      it.copy(
                          connectedDevice = device,
                          activeSheet = if (pending != null) ActiveSheet.None else it.activeSheet,
                          message = "Connected to ${device.name}"
                      )
                  }
                  if (pending != null) onCastStream(pending)
              }

              override fun onDisconnect() {
                  pendingCastStreamId = null
                  _uiState.update {
                      it.copy(
                          connectedDevice = null,
                          nowPlaying = null,
                          activeSheet = ActiveSheet.None,
                          message = "Disconnected"
                      )
                  }
              }

              override fun onVolumeChange(value: Float) {
                  _uiState.update { it.copy(volume = value.coerceIn(0f, 1f)) }
              }

              override fun onRouteAudioToPhone(enabled: Boolean) {
                  _uiState.update { it.copy(routeAudioToPhone = enabled) }
              }

              // ------------------------------------------------------ Streams/playback

              override fun onCastStream(id: String) {
                  val state = _uiState.value
                  val stream = state.detectedStreams.firstOrNull { it.id == id } ?: return
                  val device = state.connectedDevice
                  if (device == null) {
                      pendingCastStreamId = id
                      _uiState.update {
                          it.copy(activeSheet = ActiveSheet.DevicePicker, message = "Choose a device to cast to")
                      }
                      return
                  }
                  _uiState.update {
                      it.copy(
                          nowPlaying = NowPlaying(stream = stream),
                          activeSheet = ActiveSheet.None,
                          message = "Casting \"${stream.title}\" to ${device.name}"
                      )
                  }
              }

              override fun onAddToQueue(id: String) {
                  val stream = _uiState.value.detectedStreams.firstOrNull { it.id == id } ?: return
                  _uiState.update {
                      it.copy(
                          queue = it.queue + QueueItem(UUID.randomUUID().toString(), stream),
                          message = "Added to queue"
                      )
                  }
              }

              override fun onLinkCopied(id: String) {
                  _uiState.update { it.copy(message = "Link copied") }
              }

              override fun onTogglePlayPause() {
                  _uiState.update { s ->
                      val np = s.nowPlaying ?: return@update s
                      val atEnd = np.positionMs >= np.stream.durationMs
                      s.copy(
                          nowPlaying = np.copy(
                              isPlaying = !np.isPlaying,
                              positionMs = if (atEnd) 0L else np.positionMs
                          )
                      )
                  }
              }

              override fun onSeekBy(deltaMs: Long) {
                  _uiState.update { s ->
                      val np = s.nowPlaying ?: return@update s
                      if (!s.canSeek) return@update s
                      s.copy(
                          nowPlaying = np.copy(
                              positionMs = (np.positionMs + deltaMs).coerceIn(0L, np.stream.durationMs)
                          )
                      )
                  }
              }

              override fun onSeekToFraction(fraction: Float) {
                  _uiState.update { s ->
                      val np = s.nowPlaying ?: return@update s
                      if (!s.canSeek) return@update s
                      s.copy(
                          nowPlaying = np.copy(
                              positionMs = (fraction.coerceIn(0f, 1f) * np.stream.durationMs).toLong()
                          )
                      )
                  }
              }

              private fun advancePlayback() {
                  _uiState.update { s ->
                      val np = s.nowPlaying ?: return@update s
                      if (!np.isPlaying) return@update s
                      val next = np.positionMs + TICK_MS
                      when {
                          next < np.stream.durationMs -> s.copy(nowPlaying = np.copy(positionMs = next))
                          s.queue.isNotEmpty() -> s.copy(
                              nowPlaying = NowPlaying(stream = s.queue.first().stream),
                              queue = s.queue.drop(1)
                          )
                          else -> s.copy(
                              nowPlaying = np.copy(positionMs = np.stream.durationMs, isPlaying = false)
                          )
                      }
                  }
              }

              // ------------------------------------------------------ Remote utilities

              override fun onSelectRemoteTab(tab: RemoteTab) {
                  _uiState.update { it.copy(remoteTab = tab) }
              }

              override fun onSubtitleDelay(deltaMs: Int) {
                  _uiState.update {
                      it.copy(subtitleDelayMs = (it.subtitleDelayMs + deltaMs).coerceIn(-10_000, 10_000))
                  }
              }

              override fun onResetSubtitleDelay() {
                  _uiState.update { it.copy(subtitleDelayMs = 0) }
              }

              override fun onSubtitleSelected(fileName: String) {
                  _uiState.update { it.copy(subtitleFileName = fileName, message = "Subtitles loaded: $fileName") }
              }

              override fun onDpad(key: DpadKey) {
                  _uiState.update { it.copy(lastDpadKey = key) }
              }

              override fun onPlayQueueItem(queueId: String) {
                  _uiState.update { s ->
                      val item = s.queue.firstOrNull { it.queueId == queueId } ?: return@update s
                      s.copy(
                          nowPlaying = NowPlaying(stream = item.stream),
                          queue = s.queue.filterNot { it.queueId == queueId }
                      )
                  }
              }

              override fun onRemoveQueueItem(queueId: String) {
                  _uiState.update { s -> s.copy(queue = s.queue.filterNot { it.queueId == queueId }) }
              }

              override fun onMessageShown() {
                  _uiState.update { it.copy(message = null) }
              }

              private companion object {
                  const val TICK_MS = 500L
              }
          }

