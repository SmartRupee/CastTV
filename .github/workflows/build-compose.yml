          @Composable
          private fun DPadButton(icon: ImageVector, description: String, onClick: () -> Unit) {
              FilledIconButton(
                  onClick = onClick,
                  modifier = Modifier.size(56.dp),
                  colors = IconButtonDefaults.filledIconButtonColors(
                      containerColor = CastColors.CardHigh,
                      contentColor = CastColors.TextPrimary
                  )
              ) {
                  Icon(icon, contentDescription = description, modifier = Modifier.size(30.dp))
              }
          }

          private fun swipeKey(total: Offset): DpadKey? {
              val threshold = 40f
              return when {
                  abs(total.x) < threshold && abs(total.y) < threshold -> null
                  abs(total.x) > abs(total.y) -> if (total.x > 0) DpadKey.Right else DpadKey.Left
                  else -> if (total.y > 0) DpadKey.Down else DpadKey.Up
              }
          }

          @Composable
          private fun Trackpad(onKey: (DpadKey) -> Unit) {
              val currentOnKey by rememberUpdatedState(onKey)
              Box(
                  modifier = Modifier
                      .fillMaxWidth()
                      .height(180.dp)
                      .clip(RoundedCornerShape(20.dp))
                      .background(CastColors.CardHigh)
                      .border(1.dp, CastColors.Outline, RoundedCornerShape(20.dp))
                      .pointerInput(Unit) {
                          detectTapGestures(onTap = { currentOnKey(DpadKey.Ok) })
                      }
                      .pointerInput(Unit) {
                          var total = Offset.Zero
                          detectDragGestures(
                              onDragStart = { total = Offset.Zero },
                              onDragEnd = { swipeKey(total)?.let { currentOnKey(it) } },
                              onDragCancel = { total = Offset.Zero }
                          ) { change, dragAmount ->
                              change.consume()
                              total += dragAmount
                          }
                      },
                  contentAlignment = Alignment.Center
              ) {
                  Column(horizontalAlignment = Alignment.CenterHorizontally, verticalArrangement = Arrangement.spacedBy(8.dp)) {
                      Icon(Icons.Filled.TouchApp, contentDescription = null, tint = CastColors.Cyan, modifier = Modifier.size(36.dp))
                      Text("Swipe to move \u2022 Tap to select", color = CastColors.TextSecondary, style = MaterialTheme.typography.bodySmall)
                  }
              }
          }

          // ------------------------------------------------------------------- Queue

          @Composable
          private fun QueueTab(state: CastUiState, actions: CastActions) {
              if (state.queue.isEmpty()) {
                  InfoBanner("The queue is empty. Add streams from the Detected Media sheet.")
                  return
              }
              Column(verticalArrangement = Arrangement.spacedBy(8.dp)) {
                  state.queue.forEachIndexed { index, item ->
                      Row(
                          modifier = Modifier
                              .fillMaxWidth()
                              .clip(RoundedCornerShape(14.dp))
                              .background(CastColors.CardHigh)
                              .padding(start = 12.dp, top = 8.dp, bottom = 8.dp, end = 4.dp),
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          Text(
                              "${index + 1}",
                              color = CastColors.Cyan,
                              style = MaterialTheme.typography.titleSmall.copy(fontWeight = FontWeight.Bold),
                              modifier = Modifier.width(24.dp)
                          )
                          Column(Modifier.weight(1f)) {
                              Text(
                                  item.stream.title,
                                  style = MaterialTheme.typography.bodyMedium.copy(fontWeight = FontWeight.Medium),
                                  maxLines = 1,
                                  overflow = TextOverflow.Ellipsis
                              )
                              Text(
                                  "${item.stream.quality} \u2022 ${formatDuration(item.stream.durationMs)}",
                                  color = CastColors.TextSecondary,
                                  style = MaterialTheme.typography.labelSmall
                              )
                          }
                          IconButton(onClick = { actions.onPlayQueueItem(item.queueId) }) {
                              Icon(Icons.Filled.PlayArrow, contentDescription = "Play now", tint = CastColors.Cyan)
                          }
                          IconButton(onClick = { actions.onRemoveQueueItem(item.queueId) }) {
                              Icon(Icons.Filled.Delete, contentDescription = "Remove from queue", tint = CastColors.TextSecondary)
                          }
                      }
                  }
              }
          }
